<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>TURF | Playgrounds</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/portal.css">
    <link rel="stylesheet" href="assets/css/playground-cards.css">
    <link rel="stylesheet" href="assets/css/playground-explorer.css">
    <link rel="stylesheet" href="assets/css/universal-responsive.css">
</head>
<body class="venue-explorer">
    <main class="portal explorer-shell">
        <header class="portal-head explorer-head">
            <div><a class="back-link" href="dashboard.html">← Back to dashboard</a><span class="eyebrow">VENUE DIRECTORY</span><h1>Explore playgrounds</h1><p>Compare active venues, review facilities and choose the right slot with confidence.</p></div>
            <a id="book-slots-link" class="button header-booking-cta" href="booking.html"><span class="booking-cta-icon" aria-hidden="true">&#9201;</span><span><b>Book a slot</b><small>Choose your time</small></span></a>
        </header>
        <section class="panel form-panel show explorer-search"><label for="search"><span>Find a playground</span><input id="search" type="search" placeholder="Search by name, area, district or sport" autocomplete="off"></label></section>
        <section id="results" class="grid"><p class="empty">Loading playgrounds…</p></section>
    </main>
    <script>
        const api = "https://smart-playground-booking-tournament.onrender.com/api/v1";
        const results = document.querySelector("#results");
        const search = document.querySelector("#search");
        const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (character) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character]));
        let user = null;
        try { user = JSON.parse(localStorage.getItem("authUser") || "null"); } catch (_) { /* browsing remains public */ }
        const isCustomer = user?.role === "customer";
        if (!isCustomer) document.querySelector("#book-slots-link").hidden = true;

        const openDetails = (ground) => {
            document.querySelector("#ground-details-modal")?.remove();
            const ownerId = String(ground.playgroundAdmin?._id || ground.playgroundAdmin?.id || ground.playgroundAdmin || "");
            const phone = String(ground.phone || "").replace(/[^+\d]/g, "");
            const facilities = Array.isArray(ground.facilities) && ground.facilities.length
                ? ground.facilities.map((facility) => '<span class="badge">' + escapeHtml(facility) + "</span>").join(" ")
                : '<span class="meta">Facilities will be confirmed by the venue.</span>';
            const contact = isCustomer ? '<div class="venue-contact-actions">' + (ownerId ? '<a class="button alt" href="chat.html?contact=' + encodeURIComponent(ownerId) + '">Chat with venue</a>' : "") + (phone ? '<a class="button alt call-venue" href="tel:' + escapeHtml(phone) + '">Call venue</a>' : "") + "</div>" : "";
            const mapQuery = [ground.name, ground.address, ground.area, ground.district].filter(Boolean).join(", ");
            const savedMapUrl = String(ground.googleMapLocation || "").trim();
            const mapUrl = /^https?:\/\//i.test(savedMapUrl) ? savedMapUrl : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(mapQuery);
            const savedCoordinates = savedMapUrl.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
            const mapEmbedQuery = savedCoordinates ? savedCoordinates[1] + "," + savedCoordinates[2] : mapQuery;
            const book = mapQuery ? '<section class="venue-map-preview"><header><div><span>VENUE LOCATION</span><strong>Find this playground on Google Maps</strong></div><a href="' + escapeHtml(mapUrl) + '" target="_blank" rel="noopener">Open map</a></header><iframe title="' + escapeHtml(ground.name) + ' location map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=' + encodeURIComponent(mapEmbedQuery) + '&output=embed"></iframe></section>' : "";
            const modal = document.createElement("div");
            modal.id = "ground-details-modal";
            modal.className = "modal show";
            modal.innerHTML = '<div class="modal-box ground-details"><button class="close" type="button" aria-label="Close details">×</button><img class="ground-detail-image" src="' + escapeHtml(ground.coverImage || "assets/images/hero-bg.jpg") + '" alt="' + escapeHtml(ground.name) + '"><span class="badge">' + escapeHtml(ground.sportType || "Sports") + "</span><h2>" + escapeHtml(ground.name) + "</h2><p class=\"meta\">" + escapeHtml(ground.address || ground.area || "Location not provided") + "</p><p class=\"ground-description\">" + escapeHtml(ground.description || "No additional venue description has been added yet.") + "</p><div class=\"ground-info\"><span><strong>Opening hours</strong>" + escapeHtml(ground.openingTime || "—") + " – " + escapeHtml(ground.closingTime || "—") + "</span><span><strong>Players</strong>Up to " + escapeHtml(ground.maxPlayers || "—") + " players</span><span><strong>Starting price</strong>৳" + Number(ground.pricing?.morning || 0).toLocaleString() + " / hour</span></div><h3>Facilities</h3><div class=\"facility-list\">" + facilities + "</div>" + contact + book + "</div>";
            document.body.append(modal);
            const close = () => modal.remove();
            modal.querySelector(".close").onclick = close;
            modal.onclick = (event) => { if (event.target === modal) close(); };
        };

        const render = (grounds) => {
            results.innerHTML = grounds.length ? grounds.map((ground, index) => '<article class="card venue-card"><img class="playground-cover" src="' + escapeHtml(ground.coverImage || "assets/images/hero-bg.jpg") + '" alt="' + escapeHtml(ground.name) + '"><div class="venue-card-body"><span class="badge">' + escapeHtml(ground.sportType || "Sports") + '</span><h2>' + escapeHtml(ground.name) + '</h2><p class="venue-location">' + escapeHtml(ground.area || ground.address || "Location available after booking") + '</p><div class="venue-card-meta"><span>From <strong>৳' + Number(ground.pricing?.morning || 0).toLocaleString() + '</strong> / hour</span><span>' + escapeHtml(ground.openingTime || "Hours on request") + '</span></div><div class="card-foot"><button class="alt details-ground" type="button" data-index="' + index + '">View details</button>' + (isCustomer ? '<a class="button" href="booking.html?playground=' + encodeURIComponent(ground._id) + '">Book now</a>' : "") + '</div></div></article>').join("") : '<p class="empty">No active playground matches your search.</p>';
            results.querySelectorAll(".details-ground").forEach((button) => { button.onclick = () => openDetails(grounds[Number(button.dataset.index)]); });
        };
        const load = async () => {
            results.innerHTML = '<p class="empty">Loading playgrounds…</p>';
            try {
                const response = await fetch(api + "/playgrounds?search=" + encodeURIComponent(search.value.trim()));
                const body = await response.json();
                if (!response.ok) throw new Error(body.message || "Could not load playgrounds.");
                render(body.data || []);
            } catch (error) { results.innerHTML = '<p class="empty">' + escapeHtml(error.message) + '</p>'; }
        };
        search.value = new URLSearchParams(location.search).get("search") || "";
        let timer;
        search.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(load, 250); });
        load();
    </script>
</body>
</html>
