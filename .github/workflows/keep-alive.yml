name: Render 24/7 Keep-Alive

on:
  schedule:
    # Runs every 10 minutes (cron runs UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-render:
    name: Keep Render Backend Active
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Endpoint
        run: |
          echo "=========================================="
          echo "Starting 24/7 Keep-Alive ping to Render..."
          echo "Timestamp: $(date -u)"
          echo "=========================================="
          
          TARGET_URL="https://smart-playground-booking-tournament.onrender.com/"
          HEALTH_URL="https://smart-playground-booking-tournament.onrender.com/health"
          
          echo "Pinging root: $TARGET_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$TARGET_URL" || echo "000")
          echo "Root HTTP Status: $STATUS"
          
          echo "Pinging health endpoint: $HEALTH_URL"
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$HEALTH_URL" || echo "000")
          echo "Health HTTP Status: $HEALTH_STATUS"
          
          if ([ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]) || ([ "$HEALTH_STATUS" -ge 200 ] && [ "$HEALTH_STATUS" -lt 400 ]); then
            echo "✅ Render backend is alive and warmed up!"
          else
            echo "⚠️ Non-2xx response received, but request successfully sent to wake container."
          fi
          
          echo "Keep-alive cycle finished."
