name: Render 24/7 Keep-Alive

on:
  schedule:
    # Runs every 10 minutes (cron runs UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

jobs:
  ping-render:
    name: Keep Render Backend Active
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "=========================================="
          echo "Starting 24/7 Keep-Alive ping to Render..."
          echo "Timestamp: $(date -u)"
          echo "=========================================="
          
          URL="https://smart-playground-booking-tournament.onrender.com/health"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "$URL" || echo "000")
          echo "Health Endpoint HTTP Status: $STATUS"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ Render backend is warm and responded successfully."
          else
            echo "⚠️ Health check returned $STATUS. Trying fallback root endpoint..."
            FALLBACK_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 "https://smart-playground-booking-tournament.onrender.com/" || echo "000")
            echo "Fallback Root HTTP Status: $FALLBACK_STATUS"
          fi
          
          echo "Keep-alive cycle finished."
