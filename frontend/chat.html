<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURF | Messages</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/chat.css"><link rel="stylesheet" href="assets/css/chat-search.css"><link rel="stylesheet" href="assets/css/chat-concierge.css"><link rel="stylesheet" href="assets/css/universal-responsive.css"></head>
<body><main class="chat-shell"><header class="chat-top"><a href="dashboard.html">← Dashboard</a><div><p>MESSAGES</p><h1 id="chat-title">Playground support</h1></div><button id="logout" type="button">Log out</button></header><section class="chat-app"><aside class="conversation-sidebar"><div class="conversation-heading"><div><strong id="conversation-title">Conversations</strong><span id="conversation-caption">Loading…</span></div><label class="conversation-search"><span aria-hidden="true">⌕</span><input id="conversation-search" type="search" placeholder="Search people or venues" autocomplete="off"><button id="clear-search" type="button" aria-label="Clear search" hidden>×</button></label></div><div id="conversation-list" class="conversation-list"><p class="empty">Loading conversations…</p></div></aside><section class="chat-panel"><header class="thread-header" id="thread-header"><div class="chat-avatar">T</div><div><strong>Select a conversation</strong><span>Choose a customer or playground from the list.</span></div></header><div id="message-list" class="message-list"><div class="thread-empty"><span>💬</span><h2>Your conversations will appear here</h2><p>Search for a person or select a conversation to send a message.</p></div></div><form id="message-form" class="composer" hidden><textarea id="message-input" maxlength="1200" placeholder="Write your message…" required></textarea><button type="submit">Send</button></form></section></section></main><script src="https://smart-playground-booking-tournament.onrender.com/socket.io/socket.io.js"></script><script src="assets/js/chat.js"></script></body></html>
