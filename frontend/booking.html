<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURF | Book a slot</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/portal.css"><link rel="stylesheet" href="assets/css/playground-cards.css"></head>
<body><main class="portal"><header class="portal-head"><div><a href="dashboard.html">← Dashboard</a><h1>Slot booking & tickets</h1><p>Choose a venue and date, then reserve one published time slot.</p></div><div class="user-actions"><button class="alt" id="show-my">My tickets</button><button id="logout">Log out</button></div></header>
<div id="notice" class="notice" role="status"></div>
<section class="panel form-panel show" id="booking-panel"><h2>Choose your slot</h2><div class="form-grid"><select id="ground" required><option value="">Select playground</option></select><input id="date" type="date" required><div class="full slot-help">Available slots are light green. Booked slots are white and cannot be selected.</div><div id="slot-board" class="slot-picker full"><p class="meta">Select a playground and date to view availability.</p></div><div id="selected-summary" class="selected-slot full" hidden></div><select id="method" class="full" required><option value="">Choose payment method</option><option value="bkash">bKash</option><option value="nagad">Nagad</option><option value="rocket">Rocket</option><option value="card">Card</option></select><button id="reserve" class="full" type="button" disabled>Continue to payment</button></div></section>
<div class="tabs"><button class="active" data-view="grounds">Available playgrounds</button><button data-view="bookings">My bookings</button><button data-view="tickets">My QR tickets</button></div><section id="content" class="grid"><div class="empty">Loading playgrounds…</div></section></main><script src="assets/js/booking.js"></script></body></html>
