<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TURF | Entry pass & receipt</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/receipt.css">
  <link rel="stylesheet" href="assets/css/universal-responsive.css">
</head>
<body>
  <main class="receipt">
    <header><div><p class="brand">TURF</p><h1>Entry Pass &amp; Money Receipt</h1><p class="sub">Keep this document and show the QR code at the venue gate.</p></div><span class="paid">PAID</span></header>
    <section class="ticket-title"><div><p id="type">BOOKING</p><h2 id="title">Loading receipt…</h2><p id="venue"></p></div><img id="qr" alt="Entry QR code" hidden></section>
    <section class="details" id="details"></section>
    <section class="amount"><span>Total paid</span><strong id="amount">৳0</strong></section>
    <footer><p>Generated electronically by TURF. This is a valid payment receipt and entry pass.</p><p id="reference"></p></footer>
  </main>
  <div class="actions"><a href="booking.html">Back to bookings</a><button onclick="window.print()">Print / Save PDF</button></div>
  <script src="assets/js/receipt.js?v=20260831qr1"></script>
</body>
</html>
