<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURF | Add Playground</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/playground-add.css">
    <link rel="stylesheet" href="assets/css/universal-responsive.css">
</head>
<body>
    <div class="page-shell">
        <aside class="side-panel">
            <a class="brand" href="index.html"><img src="assets/images/favicon.png" alt="TURF"><span>TURF</span></a>
            <nav class="side-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="management.html">Management</a>
                <a href="playground-admin-dashboard.html">Admin Panel</a>
            </nav>
            <a class="back-link" href="dashboard.html">← Back to dashboard</a>
        </aside>

        <main class="main-area">
            <header class="top-bar">
                <div>
                    <p class="eyebrow">PLAYGROUND SETUP</p>
                    <h1>Add New Playground</h1>
                    <p class="subtitle">Fill in the details below to register a new venue on TURF.</p>
                </div>
            </header>

            <div class="form-card">
                <form id="playground-form" class="form-grid" novalidate>
                    <div class="form-group full">
                        <label for="name">Playground Name</label>
                        <input type="text" id="name" name="name" placeholder="e.g. Dhaka Turf Arena" required>
                    </div>

                    <div class="form-group">
                        <label for="sportType">Sport Type</label>
                        <select id="sportType" name="sportType" required>
                            <option value="">Select sport</option>
                            <option value="Football">Football</option>
                            <option value="Cricket">Cricket</option>
                            <option value="Badminton">Badminton</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="maxPlayers">Maximum Players</label>
                        <input type="number" id="maxPlayers" name="maxPlayers" min="1" placeholder="e.g. 11" required>
                    </div>

                    <div class="form-group full">
                        <label for="address">Full Address</label>
                        <input type="text" id="address" name="address" placeholder="Street, area, landmark" required>
                    </div>

                    <div class="form-group full">
                        <label for="googleMapLocation">Google Maps Location <span class="optional">Optional</span></label>
                        <input type="url" id="googleMapLocation" name="googleMapLocation" placeholder="Paste the Google Maps share link for this venue">
                    </div>

                    <div class="form-group">
                        <label for="division">Division</label>
                        <input type="text" id="division" name="division" placeholder="e.g. Dhaka" required>
                    </div>

                    <div class="form-group">
                        <label for="district">District</label>
                        <input type="text" id="district" name="district" placeholder="e.g. Dhaka" required>
                    </div>

                    <div class="form-group">
                        <label for="area">Area</label>
                        <input type="text" id="area" name="area" placeholder="e.g. Dhanmondi" required>
                    </div>

                    <div class="form-group">
                        <label for="openingTime">Opening Time</label>
                        <input type="time" id="openingTime" name="openingTime" required>
                    </div>

                    <div class="form-group">
                        <label for="closingTime">Closing Time</label>
                        <input type="time" id="closingTime" name="closingTime" required>
                    </div>

                    <div class="form-group">
                        <label for="morning">Morning Price (BDT)</label>
                        <input type="number" id="morning" name="morning" min="0" placeholder="0" required>
                    </div>

                    <div class="form-group">
                        <label for="evening">Evening Price (BDT)</label>
                        <input type="number" id="evening" name="evening" min="0" placeholder="0" required>
                    </div>

                    <div class="form-group full">
                        <label for="facilities">Facilities</label>
                        <input type="text" id="facilities" name="facilities" placeholder="Changing room, Parking, Washroom, Floodlight (comma separated)">
                    </div>

                    <div class="form-group full">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" placeholder="Short description about the playground..." required></textarea>
                    </div>

                    <div class="form-group full">
                        <label class="upload-label">Cover Photo</label>
                        <div class="upload-box">
                            <input type="file" id="coverImage" name="coverImage" accept="image/*" required>
                            <span>Click or drag image here</span>
                        </div>
                        <div class="image-preview image-preview-cover" id="cover-preview" aria-live="polite"></div>
                    </div>

                    <div class="form-group full">
                        <label class="upload-label">Gallery Photos (up to 5)</label>
                        <div class="upload-box">
                            <input type="file" id="galleryImages" name="galleryImages" accept="image/*" multiple>
                            <span>Click or drag images here</span>
                        </div>
                        <div class="image-preview" id="gallery-preview" aria-live="polite"></div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary">Save Playground</button>
                        <p id="form-message" class="form-message"></p>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="assets/js/playground-add.js"></script>
</body>
</html>
