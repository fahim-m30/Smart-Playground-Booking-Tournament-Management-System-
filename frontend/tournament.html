<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURF | Tournaments</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/portal.css"><link rel="stylesheet" href="assets/css/tournament-page.css"><link rel="stylesheet" href="assets/css/tournament-overview.css"><link rel="stylesheet" href="assets/css/universal-responsive.css"></head>
<body><main class="portal"><header class="portal-head"><div><a href="dashboard.html">← Dashboard</a><h1>Tournament centre</h1><p>Discover, join, create and manage competitions from one workspace.</p></div><div class="user-actions"><button id="create-toggle" hidden>Create tournament</button><button id="logout">Log out</button></div></header><div id="notice" class="notice"></div>
<section id="create-panel" class="panel form-panel"><h2>Create tournament</h2><p class="meta">A tournament uses one approved playground. Super-admin requests go live only after that playground admin approves the venue.</p><form id="create-form" class="form-grid"><input name="name" placeholder="Tournament name" required><select name="sportType" required><option value="">Sport type</option><option>Football</option><option>Cricket</option><option>Badminton</option></select><textarea class="full" name="description" placeholder="Tournament description" required></textarea><select id="venue" class="full" required></select><input name="totalTeams" type="number" min="4" max="24" value="8" placeholder="Total teams" required><select name="groupCount" required><option value="2">2 groups</option><option value="4">4 groups</option><option value="6">6 groups</option><option value="8">8 groups</option></select><input name="playingMembers" type="number" min="1" value="5" placeholder="Playing members" required><input name="extraMembers" type="number" min="0" value="2" placeholder="Extra members"><input name="registrationFee" type="number" min="0" placeholder="Registration fee (BDT)" required><input name="startDate" type="date" required><input name="endDate" type="date" required><button class="full">Request / create tournament</button></form></section>
<section class="grid" id="content"><div class="empty">Loading tournaments…</div></section></main>
<div class="modal" id="join-modal"><div class="modal-box"><button class="close" id="close-modal">Close</button><h2 id="join-title">Join tournament</h2><p id="join-info" class="meta"></p><form id="join-form" class="form-grid"><input class="full" id="team-name" placeholder="Team name" required><section class="panel full"><h3>Captain</h3><div class="form-grid"><input id="captain-name" placeholder="Captain name" required><input id="captain-phone" inputmode="tel" placeholder="Captain phone number" required><label class="full meta">Captain photo<input id="captain-photo" type="file" accept="image/*" required></label></div></section><section id="roster-fields" class="full"></section><select class="full" id="join-method" required><option value="">Payment method</option><option value="bkash">bKash</option><option value="nagad">Nagad</option><option value="rocket">Rocket</option><option value="card">Card</option></select><button class="full">Register team & pay</button></form></div></div><script src="assets/js/tournament.js"></script></body></html>
