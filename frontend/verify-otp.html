<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURF | Verify Email</title>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <section class="auth-page">
        <div class="auth-card">
            <div class="auth-card__visual">
                <div class="auth-card__visual-content">
                    <span class="brand-pill">Email Verification</span>
                    <h2>Verify Your Email</h2>
                    <p>Enter the OTP sent to your email to activate your account and unlock login.</p>
                </div>
            </div>

            <form id="verify-otp-form" class="auth-form">
                <div>
                    <h1>Verify OTP</h1>
                    <p>Check your inbox and enter the 6-digit code below.</p>
                </div>
                <div id="verify-message"></div>
                <div class="auth-form__group">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>
                <div class="auth-form__group">
                    <label for="otp">OTP code</label>
                    <input type="text" id="otp" name="otp" placeholder="Enter 6-digit code" required maxlength="6">
                </div>
                <div class="auth-form__actions">
                    <button type="submit" class="auth-btn auth-btn--primary">Verify</button>
                    <a class="auth-link" href="login.html">Back to login</a>
                </div>
                <p class="auth-footer">If you did not receive the code, you can request a new one from the backend.</p>
            </form>
        </div>
    </section>

    <script src="assets/js/auth.js"></script>
</body>
</html>
