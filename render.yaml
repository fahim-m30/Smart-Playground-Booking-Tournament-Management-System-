services:
  - type: web
    name: turf-api
    runtime: node
    region: singapore
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: QR_SIGNING_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: APP_TIME_ZONE
        value: Asia/Dhaka
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: TURF
      - key: STORE_ID
        sync: false
      - key: STORE_PASSWORD
        sync: false
      - key: SSL_IS_LIVE
        value: "false"
